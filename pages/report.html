<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Issue | CivicFix</title>

    <link rel="stylesheet" href="../css/report.css">

    <link rel="stylesheet" href="../css/darkmode.css">

    <link rel="stylesheet" href="../css/variables.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <!-- Header -->

    <header class="report-header">

        <a href="../index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

        <h1>Report a Civic Issue</h1>

        <p>
            Help improve your city by reporting civic problems.
        </p>

    </header>

    <!-- Complaint Form -->

    <main class="report-container">

        <form id="complaintForm">

            <!-- Photo -->

            <section>

                <h2>Upload Photo</h2>

                <label for="complaintImage">Complaint Photo</label>
                <input type="file" id="complaintImage" accept="image/*">
            </section>

            <!-- Category -->

            <section>

                <h2>Issue Category</h2>

                <label for="category">Select Category</label>
                <select id="category" name="category">

                    <option value="" selected disabled>Select Category</option>
                    <option value="road-damage">Road Damage</option>

                    <option value="water-leakage">Water Leakage</option>

                    <option value="garbage">Garbage</option>

                    <option value="street-light">Street Light</option>

                    <option value="drainage">Drainage</option>

                    <option value="others">Others</option>

                </select>

            </section>

            <!-- Description -->

            <section>

                <h2>Description</h2>

                <label for="description">Issue Description</label>
                <textarea id="description" rows="6" placeholder="Describe the issue..."></textarea>

            </section>

            <!-- Location -->

            <section>

                <h2>Location</h2>

                <button type="button" id="getLocationBtn">

                    <i class="fa-solid fa-location-crosshairs"></i>

                    Get Current Location

                </button>

                <div id="map">

                    <span id="locationStatus">Map Preview</span>

                </div>

            </section>

            <!-- Citizen Details -->

            <section>

                <h2>Your Details</h2>

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Full Name">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Email Address">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Phone Number">

            </section>

            <!-- Declaration -->

            <section>

                <div class="checkbox-group">

                    <input type="checkbox" id="confirmation">

                    <label for="confirmation">I confirm that all the above information is correct.</label>

                </div>

            </section>

            <!-- Submit -->

            <button type="submit" id="submitComplaint">

                Submit Complaint

            </button>

        </form>

    </main>

    <script src="../js/report.js"></script>

</body>

</html>
